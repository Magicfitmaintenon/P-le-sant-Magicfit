[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Site RDV InBody'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/accueil.html"
  [headers.values]
    X-Robots-Tag = "noindex"
